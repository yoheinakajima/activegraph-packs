[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activegraph-packs"
version = "0.1.0"
description = "Open-source collection of ActiveGraph packs for auditable, event-sourced assistants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Pinned to the runtime branch carrying CONTRACT v1.9 (canonical
    # action_class authority) — these packs import
    # activegraph.runtime.authority and Runtime.evaluate_capability_authority.
    # Replace with "activegraph[llm]>=1.9,<2.0" (or whichever released
    # version ships the v1.9 contract) once it lands on PyPI.
    "activegraph[llm] @ git+https://github.com/yoheinakajima/activegraph@fb87db15da20034278ade83ba8d4a6cf96c49e45",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "activegraph[llm] @ git+https://github.com/yoheinakajima/activegraph@fb87db15da20034278ade83ba8d4a6cf96c49e45",
    "pydantic>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]

# Pack entry points — register each pack so `load_by_name("<name>")` works
[project.entry-points."activegraph.packs"]
core = "packs.core:pack"
activity_normalizer = "packs.activity_normalizer:pack"
usage = "packs.usage:pack"
skills = "packs.skills:pack"
eval_outcome = "packs.eval_outcome:pack"
importer_local_files = "packs.importers.local_files:pack"
importer_chatgpt_export = "packs.importers.chatgpt_export:pack"
tool_gateway = "packs.tool_gateway:pack"
secrets = "packs.secrets:pack"
memory_gateway = "packs.memory_gateway:pack"
identity_auth = "packs.identity_auth:pack"
agent_profile = "packs.agent_profile:pack"
entity = "packs.entity:pack"
communication = "packs.communication:pack"
chat = "packs.chat:pack"
email = "packs.email:pack"
schedule = "packs.schedule:pack"
telegram = "packs.telegram:pack"
whatsapp = "packs.whatsapp:pack"
mcp = "packs.mcp:pack"
evolution = "packs.evolution:pack"

research = "packs.research:pack"
codebase = "packs.codebase:pack"
team_ops = "packs.team_ops:pack"
meeting = "packs.meeting:pack"

diligence_core_bridge = "packs.bridges:pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["packs*", "bundles*"]

[tool.setuptools.package-data]
"*" = [
    "prompts/*.md",
    "fixtures/*.yaml",
    "fixtures/*.json",
    "README.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
