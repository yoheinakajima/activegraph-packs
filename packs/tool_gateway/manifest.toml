[pack]
name = "tool_gateway"
version = "0.10.0"
description = "Capability execution gateway. All external calls (APIs, MCP, local tools) flow through here for policy checks, credential injection by reference, recording, output sanitization, injection scanning, and result mapping to Core source objects. Tool output reaches models fenced as untrusted external content. It also owns provider-neutral integration profiles and budgeted exploration receipts keyed to canonical service/account identity."
license = "Apache-2.0"

[pack.provenance]
authors = ["Yohei Nakajima"]
authored_by = "human"
generator = ""
source_url = "https://github.com/yoheinakajima/activegraph-packs"
created_at = "2026-07-08T00:00:00Z"

[pack.integrity]
content_hash = "sha256:a136765afff1c451306c18831e2dd96d82e5832228eff6fa182934efd78541c6"

[dependencies]
activegraph = ">=1.9,<2.0"
python = ">=3.11"
python-deps = []

[dependencies.packs]
core = ">=0.1"

[dependencies.optional-packs]
secrets = ">=0.1"
identity_auth = ">=0.1"

[surface]
object_types = ["aggregator_profile", "integration_profile", "integration_exploration", "tool_policy", "capability_provider", "capability_call", "capability_approval", "capability_denial", "capability_result", "injection_flag"]
relation_types = ["integration_supersedes", "profile_explored_by", "calls", "approved_by", "denied_by", "produces_result", "sourced_as", "flags"]
behaviors = ["call_recorder", "policy_enforcer", "call_executor", "result_sourcer", "tool_policy_reliability_guard"]
tools = ["execute_capability", "pending_approvals", "approve_capability", "deny_capability"]
settings_schema = "ToolGatewaySettings"

[[surface.capabilities]]
