name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fixtures:
    name: Pack fixture suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Manifest drift gate ─────────────────────────────────────────────────
      # tests/test_manifests.py checks the content hash (which by design
      # EXCLUDES manifest.toml itself) and the loader-verified surface, so it
      # cannot catch drift in the manifest-AUTHORED fields: the activegraph
      # pin, the python range, python-deps, and [pack.provenance]. Regenerate
      # every manifest from the live packs and fail on any diff. The generator
      # is idempotent, so a clean tree stays clean; a stale pin (generator vs.
      # checked-in) surfaces here as a diff. The pin only means something if it
      # is checked.
      - name: Manifest drift check (regenerate + diff)
        run: |
          python scripts/generate_manifests.py
          if ! git diff --exit-code -- ':(glob)packs/**/manifest.toml'; then
            echo "::error::Checked-in manifests are stale. Run"
            echo "  python scripts/generate_manifests.py"
            echo "and commit the result."
            exit 1
          fi

      # ── Per-pack fixture suites ─────────────────────────────────────────────

      - name: core fixtures
        run: python packs/core/fixtures/run_fixtures.py

      - name: activity_normalizer fixtures
        run: python packs/activity_normalizer/fixtures/run_fixtures.py

      - name: usage fixtures
        run: python packs/usage/fixtures/run_fixtures.py

      - name: importer_local_files fixtures
        run: python packs/importers/local_files/fixtures/run_fixtures.py

      - name: importer_chatgpt_export fixtures
        run: python packs/importers/chatgpt_export/fixtures/run_fixtures.py

      - name: tool_gateway fixtures
        run: python packs/tool_gateway/fixtures/run_fixtures.py

      - name: secrets fixtures
        run: python packs/secrets/fixtures/run_fixtures.py

      - name: memory_gateway fixtures
        run: python packs/memory_gateway/fixtures/run_fixtures.py

      - name: identity_auth fixtures
        run: python packs/identity_auth/fixtures/run_fixtures.py

      - name: agent_profile fixtures
        run: python packs/agent_profile/fixtures/run_fixtures.py

      - name: entity fixtures
        run: python packs/entity/fixtures/run_fixtures.py

      - name: communication fixtures
        run: python packs/communication/fixtures/run_fixtures.py

      - name: chat fixtures
        run: python packs/chat/fixtures/run_fixtures.py

      - name: email fixtures
        run: python packs/email/fixtures/run_fixtures.py

      - name: research fixtures
        run: python packs/research/fixtures/run_fixtures.py

      - name: codebase fixtures
        run: python packs/codebase/fixtures/run_fixtures.py

      - name: team_ops fixtures
        run: python packs/team_ops/fixtures/run_fixtures.py

      - name: meeting fixtures
        run: python packs/meeting/fixtures/run_fixtures.py

      - name: bridges fixtures
        run: python packs/bridges/fixtures/run_fixtures.py

      - name: schedule fixtures
        run: python packs/schedule/fixtures/run_fixtures.py

      - name: telegram fixtures
        run: python packs/telegram/fixtures/run_fixtures.py

      - name: whatsapp fixtures
        run: python packs/whatsapp/fixtures/run_fixtures.py

      - name: mcp fixtures
        run: python packs/mcp/fixtures/run_fixtures.py

      - name: evolution fixtures
        run: python packs/evolution/fixtures/run_fixtures.py

      # ── Cross-pack integration suites ───────────────────────────────────────

      - name: Cross-pack integration (Tool Gateway → Core → Memory Gateway)
        run: python packs/fixtures/cross_pack_integration.py

      - name: Cross-pack integration (Communication + Chat + Email + Identity)
        run: python packs/fixtures/comm_chat_email_integration.py

      - name: Cross-pack integration (Identity + Agent Profile + Entity)
        run: python packs/fixtures/identity_profile_entity_integration.py

      # ── pytest suite (unit + regression tests under tests/) ────────────────

      - name: pytest suite
        run: python -m pytest tests/ -q
